context:
  version: "2.1.0"

package:
  name: zet
  version: ${{ version }}

source:
  url: https://github.com/yarrow/zet/archive/v${{ version }}.tar.gz
  sha256: 678e569b4506c7099a4d99e75d420cf3b852ae3b5f19cd83e1a0d37be815a483

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - script:
      - zet --help

about:
  license: MIT
  license_file:
    - LICENSE-MIT
    - THIRDPARTY.yml
  summary: CLI utility to find the union, intersection, and set difference of files
  homepage: https://github.com/yarrow/zet
  repository: https://github.com/yarrow/zet

extra:
  recipe-maintainers:
    - danielnachun
